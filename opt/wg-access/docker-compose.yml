services:
  postgres:
    image: postgres:16-alpine
    container_name: wgaccess-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wgaccess_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wg_access -d wg_access"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    container_name: wgaccess-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "0.0.0.0:${BACKEND_PORT:-18080}:8000"
    command: >
      sh -c "
      pip install --no-cache-dir fastapi uvicorn psycopg[binary] sqlalchemy alembic pydantic-settings email-validator cryptography qrcode &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wgaccess_pgdata:
